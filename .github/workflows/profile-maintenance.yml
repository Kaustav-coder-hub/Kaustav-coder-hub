name: Profile maintenance

on:
  workflow_dispatch:
  schedule:
    # Every Sunday at 09:15 IST (03:45 UTC)
    - cron: "45 3 * * 0"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh project list and recent activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Kaustav-coder-hub
        run: python scripts/update_profile.py

      - name: Commit changes if needed
        run: |
          if [[ -n "$(git status --porcelain README.md)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: refresh profile projects and activity"
            git push
          else
            echo "Profile is already up to date."
          fi
