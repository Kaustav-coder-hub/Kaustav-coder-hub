name: README quality checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  readme-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate README structure and project markers
        run: python scripts/check_readme.py
      - name: Compile Python scripts
        run: python -m py_compile scripts/update_profile.py scripts/check_readme.py
